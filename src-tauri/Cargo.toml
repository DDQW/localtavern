[package]
name = "localtavern"
version = "0.2.27"
description = "LocalTavern - local-first AI character chat"
authors = ["Dominik Wölki"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "localtavern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["stream"] }
futures = "0.3.34"
async-stream = "0.3.6"
async-trait = "0.1.92"
bytes = "1.12.1"
base64 = "0.23.1"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
keyring = "4.2.0"
tokio-util = "0.7.19"
tauri-plugin-dialog = "2.8.0"
getrandom = "0.4"
sha2 = "0.11"
tauri-plugin-fs = "2.7.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.1"
webpki-root-certs = "1.0.10"
